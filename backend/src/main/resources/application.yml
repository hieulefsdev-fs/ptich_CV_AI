server:
  port: 8080
  servlet:
    context-path: /api/v1
  # Behind Nginx/Cloudflare reverse proxy
  forward-headers-strategy: framework

spring:
  application:
    name: cv-analysis-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cv_analysis_db}
    username: ${DB_USERNAME:cv_admin}
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    open-in-view: false

  jackson:
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_AT_LEAST_256_BITS}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h
  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:10}
  quota:
    max-free-analyses: ${MAX_FREE_ANALYSES:3}
  mail:
    from: ${MAIL_FROM:no-reply@cvai.local}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
    base-url: https://generativelanguage.googleapis.com/v1beta
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payment/vnpay-return}
    plus-price-vnd: ${VNPAY_PLUS_PRICE:25000}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  admin:
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.cvai.backend: INFO
    org.springframework.security: WARN
