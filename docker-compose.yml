name: cvai

services:
  postgres:
    image: postgres:16-alpine
    container_name: cvai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cv_analysis_db}
      POSTGRES_USER: ${DB_USERNAME:-cv_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [cvai_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cv_admin} -d ${DB_NAME:-cv_analysis_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: cvai_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cv_analysis_db}
      DB_USERNAME: ${DB_USERNAME:-cv_admin}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      MAX_FREE_ANALYSES: ${MAX_FREE_ANALYSES:-3}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL}
      VNPAY_PLUS_PRICE: ${VNPAY_PLUS_PRICE:-25000}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL}
    networks: [cvai_net]
    # Không mở cổng ra host: frontend gọi backend qua http://backend:8080

  frontend:
    build: ./frontend
    container_name: cvai_frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "127.0.0.1:${FRONTEND_PORT:?FRONTEND_PORT is required}:80"
    networks: [cvai_net]

networks:
  cvai_net:
    name: cvai_net

volumes:
  pgdata:
